aid: luminance
name: Luminance
description: 'Luminance Technologies Ltd. is a UK-headquartered legal-AI company, founded
  in 2015 out of Cambridge mathematics research, that builds what it markets as Legal-Grade
  AI for the full contract lifecycle — drafting, negotiation, analysis, compliance, investigation
  and collaboration. The platform is delivered as a per-customer instance (an "instance
  moniker" subdomain) and exposes a documented RESTful HTTP/JSON API that lets external
  software read and act on projects, folders, documents, matters, matter versions, tasks,
  reviews, annotations, workflows and document templates, plus machine-learning surfaces
  such as Traffic Light Analysis and annotation-driven contract intelligence. Three OpenAPI
  3.0 versions are published from Luminance''s own API host: v1.3.0 and v1.4.0 (OAuth2
  client-credentials) and the newer "Public API v2" v1.5, which is deployed by standard
  to Luminance product versions 1.43.0 onward. Authentication is OAuth2 client credentials
  against the customer instance token endpoint, and API traffic is rate limited to 100
  requests every 10 minutes.'
