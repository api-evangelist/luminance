- name: Luminance Public API v2
  description: 'The current Luminance REST API (documented as version 1.5, "Public API
    v2"), deployed by standard to Luminance product versions 1.43.0 onward. 62 paths /
    94 operations across System, Users, Projects, Folders, Documents, Document Templates,
    Matters, Tasks, Workflows, Annotation Types, Annotation Sources, Annotation Source
    Relations, Project Users and Search. Served from the customer''s own instance host
    under /api2 and authenticated with an OAuth2 client-credentials bearer token.'
