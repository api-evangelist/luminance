openapi: 3.0.3
info:
  title: Luminance Public API v2
  version: '1.5'
  description: "Luminance offers a RESTful HTTP-based API utilizing JSON as the primary serialization format and OAuth2 for\
    \ authentication. This API is engineered to seamlessly integrate your software with the Luminance Platform, leveraging\
    \ its objects and endpoints to enhance your applications.\n\nWith this API, you can create integrations that allow direct\
    \ access to folders, tasks, and documents stored in Luminance. Additionally, you can track document progress through reviews\
    \ or utilize machine learning capabilities via annotations and Traffic Light Analysis.\n\nThe Luminance API is designed\
    \ with developers in mind, providing comprehensive documentation and robust support to ensure smooth integration. It adheres\
    \ to industry standards, ensuring compatibility and security. Developers can take advantage of the API's flexibility to\
    \ build custom solutions, automate workflows, and enhance overall efficiency within their applications.\n\nAPI requests\
    \ are rate limited for security reasons to 100 requests every 10 minutes.\n\nThis version of the API is deployed by standard\
    \ to Luminance product versions 1.43.0 onwards\n\n## Authentication (OAuth2 client credentials)\n\nTo test endpoints from\
    \ this document you need an access token. Use the **Authorize** button and enter the token as described below.\n\n1. **Prerequisites**\n\
    \   Ensure you have a Client ID and Client Secret (configured as a Service User).\n\n2. **Encode credentials**\n   Base64-encode\
    \ the string `<client-id>:<client-secret>`. For example:\n   `echo -n '<client-id>:<client-secret>' | base64`\n\n3. **Request\
    \ a token**\n   Send a POST request to your instance token endpoint:\n   - URL: `https://<moniker>.app.luminance.com/auth/oauth2/token`\
    \ (replace `<moniker>` with your instance moniker).\n   - Headers: `Content-Type: application/x-www-form-urlencoded`,\
    \ `Authorization: Basic <base64_encoded_credentials>`.\n   - Body: `grant_type=client_credentials`.\n\n   Example:\n \
    \  ```\n   curl 'https://<moniker>.app.luminance.com/auth/oauth2/token' \\\n     -X POST \\\n     -H 'Content-Type: application/x-www-form-urlencoded'\
    \ \\\n     -H 'Authorization: Basic <base64_encoded_credentials>' \\\n     -d 'grant_type=client_credentials'\n   ```\n\
    \n4. **Use the token**\n   The response includes `access_token`. In this UI, click **Authorize**, choose **bearerAuth**,\
    \ and paste the `access_token` value (no \"Bearer \" prefix needed). Then call any endpoint; the request will send `Authorization:\
    \ Bearer <access_token>`.\n\n5. **Example API call**\n   Once authorized, use the token in the `Authorization` header\
    \ for requests, e.g.:\n   `curl 'https://<moniker>.app.luminance.com/api2/<chosen-path>' -H 'Authorization: Bearer <access_token>'`\n"
servers:
- url: https://{moniker}.app.luminance.com
  description: Your Luminance instance
  variables:
    moniker:
      default: your-instance
      description: Instance moniker (e.g. acme)
security:
- bearerAuth: []
tags:
- name: System
- name: Users
- name: Projects
- name: Folders
- name: Documents
- name: Document Templates
- name: Matters
- name: Tasks
- name: Workflows
- name: Annotation Types
- name: Annotation Sources
- name: Annotation Source Relations
- name: Project Users
- name: Search
paths:
  /api2/:
    get:
      tags:
      - System
      summary: Get system data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
              example:
                product: corporate
                version: 4.1.7
                api2_version: 1.4.0
  /api2/users:
    get:
      tags:
      - Users
      summary: List users
      description: Only Service Users with Administrator permissions can access this list.
      parameters:
      - in: query
        name: id
        schema:
          type: integer
        description: Unique user ID
      - in: query
        name: username
        schema:
          type: string
        description: Username (login)
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: account_id
        schema:
          type: integer
        description: Associated account ID
      - in: query
        name: state
        schema:
          type: string
        description: User state (e.g. active)
      - in: query
        name: multi_factor_auth_enabled
        schema:
          type: boolean
        description: If true, MFA is enabled for this user
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
        description: Maximum number of objects to return
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
        description: Number of objects to skip (pagination)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                username: joe.bloggs
                name: Joe Bloggs
                email: joe.bloggs@example.com
                account_id: 1
                state: active
  /api2/users/{id}:
    get:
      tags:
      - Users
      summary: Get user by id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                username: joe.bloggs
                name: Joe Bloggs
                email: joe.bloggs@example.com
                account_id: 1
                state: active
        '404':
          description: Not found
  /api2/users/me:
    get:
      tags:
      - Users
      summary: Get current user (the user associated with the authentication token)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                username: joe.bloggs
                name: Joe Bloggs
                email: joe.bloggs@example.com
                account_id: 1
                state: active
  /api2/project_users:
    get:
      tags:
      - Project Users
      summary: List project users
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: project_id
        schema:
          type: integer
      - in: query
        name: user_id
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: roles
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectUser'
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                project_id: 1
                user_id: 1
                type: document
                roles:
                - admin
  /api2/project_users/{id}:
    get:
      tags:
      - Project Users
      summary: Get project user by id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUser'
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                project_id: 1
                user_id: 1
                type: document
                roles:
                - admin
        '404':
          description: Not found
  /api2/annotation_types:
    get:
      tags:
      - Annotation Types
      summary: List annotation types
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: key
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: pre_built
        schema:
          type: boolean
      - in: query
        name: options
        schema:
          type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                type: document
                key: example_key
                system: false
                name: Joe Bloggs
                options: {}
  /api2/annotation_types/{id}:
    get:
      tags:
      - Annotation Types
      summary: Get annotation type by id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                type: document
                key: example_key
                system: false
                name: Joe Bloggs
                options: {}
        '404':
          description: Not found
  /api2/annotation_sources:
    get:
      tags:
      - Annotation Sources
      summary: List annotation sources
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: annotation_type_id
        schema:
          type: integer
      - in: query
        name: room_id
        schema:
          type: integer
      - in: query
        name: workflow_id
        schema:
          type: integer
      - in: query
        name: annotation_source_relation_id
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: Sample text
                state: active
    post:
      tags:
      - Annotation Sources
      summary: Create annotation source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                annotation_type_id:
                  type: integer
                room_id:
                  type: integer
                workflow_id:
                  type: integer
                annotation_source_relation_id:
                  type: integer
                content:
                  type: object
            example:
              annotation_type_id: 97
              room_id: 1
              workflow_id: null
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: {}
                state: active
    patch:
      tags:
      - Annotation Sources
      summary: Update annotation sources by filter
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: annotation_type_id
        schema:
          type: integer
      - in: query
        name: room_id
        schema:
          type: integer
      - in: query
        name: workflow_id
        schema:
          type: integer
      - in: query
        name: annotation_source_relation_id
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                annotation_type_id:
                  type: integer
                room_id:
                  type: integer
                workflow_id:
                  type: integer
                annotation_source_relation_id:
                  type: integer
                content:
                  type: object
                state:
                  type: string
            example:
              state: active
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: Sample text
                state: active
  /api2/annotation_sources/{id}:
    get:
      tags:
      - Annotation Sources
      summary: Get annotation source
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: Sample text
                state: active
        '404':
          description: Not found
    patch:
      tags:
      - Annotation Sources
      summary: Update annotation source
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                annotation_type_id:
                  type: integer
                room_id:
                  type: integer
                workflow_id:
                  type: integer
                annotation_source_relation_id:
                  type: integer
                content:
                  type: object
                state:
                  type: string
            example:
              state: active
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: Sample text
                state: active
  /api2/annotation_source_relations:
    get:
      tags:
      - Annotation Source Relations
      summary: List annotation source relations
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                name: Joe Bloggs
                state: active
    post:
      tags:
      - Annotation Source Relations
      summary: Create annotation source relation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
            example:
              name: My relation
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                name: Joe Bloggs
                state: active
  /api2/annotation_source_relations/{id}:
    get:
      tags:
      - Annotation Source Relations
      summary: Get annotation source relation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                name: Joe Bloggs
                state: active
        '404':
          description: Not found
    patch:
      tags:
      - Annotation Source Relations
      summary: Update annotation source relation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
            example:
              name: Updated name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                name: Joe Bloggs
                state: active
  /api2/search:
    get:
      tags:
      - Search
      summary: Aggregated search
      parameters:
      - in: query
        name: groupBy
        required: true
        description: One of `documents` or `matters`
        schema:
          type: string
          enum:
          - documents
          - matters
          - groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                result:
                - id: 1
                  name: Joe Bloggs
                page: 1
                pageSize: 1
                totalPages: 1
        '422':
          description: Validation error
  /api2/search/documents:
    get:
      tags:
      - Search
      summary: Search documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                result:
                - id: 1
                  name: Joe Bloggs
                page: 1
                pageSize: 1
                totalPages: 1
  /api2/search/matters:
    get:
      tags:
      - Search
      summary: Search matters
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                result:
                - id: 1
                  name: Joe Bloggs
                page: 1
                pageSize: 1
                totalPages: 1
  /api2/projects:
    get:
      tags:
      - Projects
      summary: List projects the authenticated user can access
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: moniker
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: account_id
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: permissions
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                moniker: Hello World
                name: Joe Bloggs
                account_id: 1
                state: active
                permissions: {}
                settings: {}
                type: document
                features:
                - bulkredact
  /api2/projects/{project_id}:
    get:
      tags:
      - Projects
      summary: Get project by id
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                moniker: Hello World
                name: Joe Bloggs
                account_id: 1
                state: active
                permissions: {}
                settings: {}
                type: document
                features:
                - bulkredact
        '404':
          description: Not found
  /api2/projects/{project_id}/folders:
    get:
      tags:
      - Folders
      summary: List folders
      parameters:
      - $ref: '#/components/parameters/projectId'
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: parent_id
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                parent_id: 1
                name: Joe Bloggs
                media_type: application/pdf
                project_id: 1
                state: active
                type: document
    post:
      tags:
      - Folders
      summary: Create folder
      parameters:
      - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  nullable: true
                name:
                  type: string
                type:
                  type: string
            example:
              parent_id: 1
              name: My Folder
              type: folder
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                parent_id: 1
                name: Joe Bloggs
                media_type: application/pdf
                project_id: 1
                state: active
                type: document
    patch:
      tags:
      - Folders
      summary: Update folders by filter
      parameters:
      - $ref: '#/components/parameters/projectId'
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: parent_id
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
            example:
              state: active
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                parent_id: 1
                name: Joe Bloggs
                media_type: application/pdf
                project_id: 1
                state: active
                type: document
    delete:
      tags:
      - Folders
      summary: Delete folders by filter
      parameters:
      - $ref: '#/components/parameters/projectId'
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: parent_id
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /api2/projects/{project_id}/folders/{folder_id}:
    get:
      tags:
      - Folders
      summary: Get folder
      parameters:
      - $ref: '#/components/parameters/projectId'
      - in: path
        name: folder_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                parent_id: 1
                name: Joe Bloggs
                media_type: application/pdf
                project_id: 1
                state: active
                type: document
    patch:
      tags:
      - Folders
      summary: Update folder
