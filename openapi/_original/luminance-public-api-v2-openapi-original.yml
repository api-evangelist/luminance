components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from the OAuth2 client credentials flow. See the Authentication section above for how to
        obtain a token (curl to your instance token endpoint); then paste the access_token here.

        '
  parameters:
    projectId:
      in: path
      name: project_id
      required: true
      schema:
        type: integer
  schemas:
    SystemInfo:
      type: object
      description: System data returned by GET /api2/
      properties:
        product:
          type: string
          description: Product name (e.g. diligence, review)
        version:
          type: string
          description: Luminance version
        api2_version:
          type: string
          description: API v2 version
    User:
      type: object
      description: User object (see API2_Schema users table)
      properties:
        id:
