components:
  responses:
    '405':
      description: Method not allowed (calling api with wrong method)
    matter_version_assignable_users_200:
      description: JSON array of users available to be assigned to a matter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatterVersionsAssignableUsers'
          example:
            name: Support User
            id: 4
    matter_annotations_200:
      description: JSON array of Annotation objects structured in the below schema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatterAnnotation'
          example:
            id: 37495390
            created_at: '2023-04-19T12:20:39.100Z'
            created_by: 4
            matter_id: 7342
            annotation_type_id: 347
            content:
              timestamp: '2027-04-07T00:00:00.000Z'
            state: active
    matter_version_add_attachment_200:
      description: JSON object with the Matter Version created to add an attachment to a matter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatterVersion'
    '500':
      description: Internal server error
    '403':
      description: Forbidden - the authenticated user does not have sufficient permissions to perform this action
    annotation_create_200:
      description: JSON object of matter annotations after POSTing to create the matter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/annotationId'
          example:
            version: 1.3.0
            api2_version: 1.3.0
            product: corporate
    matter_version_assignable_users_201:
      description: User has been assigned to a matter version successfully
    '401':
      description: Unauthorized - the authentication provided was invalid
    matter_relations_200:
      description: JSON array of Relations for a single matter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatterRelation'
          example:
            id: 415
            created_at: '2023-04-19T12:20:39.200Z'
            created_by: 33
            source_id: 4
            target_id: 5
    matters_200:
      description: JSON array of Matters or a single JSON matter object if matter ID is referenced in the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Matters'
          example:
            id: 415
            created_at: '2023-04-19T12:20:39.200Z'
            created_by: 33
            project_id: 4
            name: New Matter
            state: active
            info: {}
    matter_versions_200:
      description: JSON array of Matter Versions or a single JSON matter version object if matter version ID is referenced in the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatterVersion'
          example:
            id: 415
            created_at: '2024-07-09T09:29:39.035Z'
            created_by: 32
            updated_at: '2024-07-09T09:29:39.035Z'
            updated_by: 32
            group_id: 1
            workflow_stage_id: 6
            document_id: 208
            type: attachment
            state: inactive
            assigned_to: None
            assigned_at: None
            name: Contract Version 1
            info: {}
    '429':
      description: Too many requests have been sent to the server over a given time period. Please contact Luminance's support team.
    '422':
      description: Unprocessable Entity - the request was well formed, but not processable
  schemas:
    MatterVersion:
      type: object
      properties:
        id:
          type: integer
          example: 415
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        created_by:
          type: integer
          example: 32
        updated_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        updated_by:
          type: integer
          example: 32
        group_id:
          type: integer
          example: 1
          description: This is the matterId the version is assigned to
        workflow_stage_id:
          type: integer
          example: 1
          description: This is the Workflow stage ID in the workflow editor the matter is in.
        type:
          type: string
          enum:
          - attachment
          - draft
          - version
          description: An attachment is not part of a matter's version history, but is typically used to store supporting documentation. A new 'version' is a new document saved as a new version, while a 'draft' version is an updated copy of the previous 'version' type group version.
        state:
          type: string
          enum:
          - active
          - inactive
          - deleted
          - executed
          description: An active matter version is the most recent draft or version type version of the contratc on the matter. Inactive versions are earlier in time than the most recent draft or version. An executed version has progressed to the end of a workflow and been executed. An attachment type version will always be inactive. Deleted versions mean the matter itself has been deleted.
        assigned_to:
          type: integer
          example: 5
          description: userId of the user the matter version is assigned to. Can be 'None'.
        assigned_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.300Z'
        info:
          type: array
          example: {}
          description: Not typically used to store data.
    MatterAnnotationPatch:
      type: object
      properties:
        annotation_type_id:
          type: integer
          example: 400
          required: true
          description: See the api2/annotation_types endpoint for specifics of the annotation_type_ids enabled on your instance.
        content:
          type: object
          properties:
            value:
              type: string
              example: Agreement
          required: false
        state:
          type: string
          example: active
          enum:
          - active
          - deleted
          required: false
          description: Can be used to patch the annotation to state deleted to delete the annotation from the user interface.
    Matter:
      type: object
      description: Matter (group) object (see API2_Schema matters table)
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by:
          type: integer
        name:
          type: string
        state:
          type: string
        info:
          type: object
        type:
          type: string
        key:
          type: string
        project_id:
          type: integer
    MatterAnnotation:
      type: object
      properties:
        id:
          type: integer
          example: 37495390
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.100Z'
        created_by:
          type: integer
          example: 3
        matter_id:
          type: integer
          example: 7342
        annotation_type_id:
          type: integer
          example: 347
          description: This corresponds to annotationTypeId available when calling the /annotation_types endpoint
        content:
          type: object
          example:
            timestamp: '2027-04-07T00:00:00.000Z'
        state:
          type: string
          enum:
          - active
          - deleted
          example: active
    MatterVersionsAssignableUsers:
      type: object
      properties:
        name:
          type: string
          example: Support User
          description: userName of the Assignable user
        id:
          type: integer
          example: 4
          description: userID of the Assignable user
    Matters:
      type: object
      properties:
        id:
          type: integer
          example: 415
          description: unique Matter Id
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        created_by:
          type: integer
          example: 32
        project_id:
          type: integer
          format: int32
          example: 4
        name:
          type: string
          example: New Matter
        state:
          type: string
          enum:
          - active
          - deleted
        info:
          type: array
          example: {}
          description: Not typically used to store data.
    MatterRelation:
      type: object
      properties:
        id:
          type: integer
          example: 415
          description: unique Matter Relation
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        created_by:
          type: integer
          example: 32
        source_id:
          type: integer
          format: int32
          example: 4
          description: Unique matter_id of the matter being related
        target_id:
          type: integer
          format: int32
          example: 4
          description: Unique matter_id of the second matter in the relationship
    MatterPatch:
      type: object
      properties:
        name:
          type: string
          example: New Matter
          required: false
        state:
          type: string
          example: active
          enum:
          - active
          - deleted
          required: false
          description: Can be used to patch the Matter to state deleted to delete the Matter from the user interface.
        info:
          type: object
          properties:
            high_priority:
              type: boolean
              example: false
          required: false
          description: Information is not typically used in the user interface. Can be used as a custom object to store notes.
  parameters:
    project-id:
      name: project-id
      in: path
      description: Project ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    documentId:
      name: id
      in: query
      description: Unique Document ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 654
    matterRelationId:
      name: id
      in: query
      description: ID of the relation a source matterId has to a target matterId
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matterAnnotationState:
      name: state
      in: query
      description: State of an Annotation attached to a Matter
      required: false
      schema:
        type: string
        enum:
        - active
        - deleted
    matterAnnotationTypeId:
      name: id
      in: query
      description: Unique Annotation Type ID for the Annotation attached to the Matter, can also be queried via the /annotation_types endpoint
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    projectId:
      in: path
      name: project_id
      required: true
      schema:
        type: integer
    matterVersionInfo:
      name: info
      in: query
      description: State
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    matterVersionState:
      name: state
      in: query
      description: Current State of the matter version
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    userId:
      name: id
      in: query
      description: Unique User ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matter-version-id:
      name: matter-version-id
      in: path
      description: Matter Version Id
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    annotationTypeId:
      name: annotation_type_id
      in: query
      description: annotationTypeId for a particular MatterAnnotation. Can be queried via the annotation_types endpoint
      required: false
      schema:
        type: integer
        example: 64
        minimum: 0
    userName:
      name: username
      in: query
      description: Username used in login credentials
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    matterId:
      name: id
      in: query
      description: Matter ID of Matter
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matterVersionName:
