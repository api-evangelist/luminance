openapi: 3.2.0
info:
  title: Luminance Public API v2 Search API
  version: '1.5'
  description: Luminance offers a RESTful HTTP-based API utilizing JSON as the primary serialization format and OAuth2 for authentication.
servers:
- url: https://{moniker}.app.luminance.com
  description: Your Luminance instance
  variables:
    moniker:
      default: your-instance
      description: Instance moniker (e.g. acme)
security:
- bearerAuth: []
tags:
- name: Search
paths:
  /api2/search:
    get:
      tags:
      - Search
      summary: Aggregated search
      parameters:
      - in: query
        name: groupBy
        required: true
        description: One of `documents` or `matters`
        schema:
          type: string
          enum:
          - documents
          - matters
          - groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                result:
                - id: 1
                  name: Joe Bloggs
                page: 1
                pageSize: 1
                totalPages: 1
        '422':
          description: Validation error
      operationId: getApi2Search
      x-operation-id-source: derived
  /api2/search/documents:
    get:
      tags:
      - Search
      summary: Search documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                result:
                - id: 1
                  name: Joe Bloggs
                page: 1
                pageSize: 1
                totalPages: 1
      operationId: getApi2SearchDocuments
      x-operation-id-source: derived
  /api2/search/matters:
    get:
      tags:
      - Search
      summary: Search matters
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                result:
                - id: 1
                  name: Joe Bloggs
                page: 1
                pageSize: 1
                totalPages: 1
      operationId: getApi2SearchMatters
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from the OAuth2 client credentials flow. See the Authentication section above for how to obtain a token (curl to your instance token endpoint); then paste the access_token here.

        '
