openapi: 3.2.0
info:
  title: Luminance Public API v2 Project Users API
  version: '1.5'
  description: Luminance offers a RESTful HTTP-based API utilizing JSON as the primary serialization format and OAuth2 for authentication.
servers:
- url: https://{moniker}.app.luminance.com
  description: Your Luminance instance
  variables:
    moniker:
      default: your-instance
      description: Instance moniker (e.g. acme)
security:
- bearerAuth: []
tags:
- name: Project Users
paths:
  /api2/project_users:
    get:
      tags:
      - Project Users
      summary: List project users
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: project_id
        schema:
          type: integer
      - in: query
        name: user_id
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: roles
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectUser'
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                project_id: 1
                user_id: 1
                type: document
                roles:
                - admin
      operationId: getApi2ProjectUsers
      x-operation-id-source: derived
  /api2/project_users/{id}:
    get:
      tags:
      - Project Users
      summary: Get project user by id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUser'
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                project_id: 1
                user_id: 1
                type: document
                roles:
                - admin
        '404':
          description: Not found
      operationId: getApi2ProjectUsersById
      x-operation-id-source: derived
components:
  schemas:
    ProjectUser:
      type: object
      description: Project user (permissions object) - user assigned to a project with roles
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by:
          type: integer
        project_id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          description: admin or standard
        roles:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from the OAuth2 client credentials flow. See the Authentication section above for how to obtain a token (curl to your instance token endpoint); then paste the access_token here.

        '
