components:
  schemas:
    Annotation:
      type: object
      properties:
        id:
          type: integer
          example: 37495390
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.100Z'
        created_by:
          type: integer
          example: 3
        document_id:
          type: integer
          example: 7342
        type:
          type: string
          example: entity:party
          enum:
          - alert
          - alias
          - contract:state
          - contracttype
          - definedterm:definition
          - definedterm:use
          - document:bates
          - document:cluster
          - document:custodian
          - document:duplicationfamily
          - document:family
          - document:privileged
          - document:relation
          - document:textinfo
          - documenttype
          - email:chain
          - email:type
          - emailaddress
          - entity:area
          - entity:boolean
          - entity:custom
          - entity:datetime
          - entity:enum
          - entity:identifier
          - entity:law
          - entity:location
          - entity:money
          - entity:organization
          - entity:party
          - entity:percent
          - entity:person
          - entity:signature
          - entity:term
          - entity:timeperiod
          - folder
          - fragment:clause
          - fragment:cluster
          - generic:boolean
          - generic:enum
          - generic:number
          - generic:text
          - language
          - page
          - pagecount
          - qa:antivirus
          - qa:blankpage
          - qa:contentextraction
          - qa:emptycontent
          - qa:encrypted
          - qa:hiddencells
          - qa:missingmodel
          - qa:ocr
          - qa:paragraphing
          - qa:partiallyindexed
          - qa:render
          - qa:restrictedfileformat
          - qa:unsupportedfileformat
          - redacted
          - search
          - source:referenceid
          - source:signed
          - structure:group
          - structure:metadata
          - structure:pagebreak
          - structure:paragraph:joined
          - structure:paragraph:split
          - structure:section
          - title
          - user
          - usertag
        roles:
          type: array
          example:
          - Counter-Party
          description: There will only ever be a single value in the role field for annotations. This corresponds to annotationTypeKey available when calling the /annotation_types endpoint
        content:
          type: object
          example:
            party: VoicePhone Limited
            raw_text: Voicephone Ltd.
        state:
          type: string
          enum:
          - active
          - deleted
          example: active
    AnnotationSourcePatch:
      type: object
      description: Payload required to PATCH an annotationSourceId
      properties:
        annotation_type_id:
          type: integer
          example: 345
          description: Please note only AnnotationTypeIds which have the following annotationType values are available to populate via an AnnotationSource 'entity:identifier','entity:location', 'entity:party', 'generic:boolean', 'generic:enum'. This is the unique annotationTypeId which this annotationSourceId populates.
          required: true
        project_id:
          type: integer
          example: Voicephone project
          description: The content for this annotationSourceId will be available only in the identified project. Set to null if the annotationSourceId should be available in all projects.
          required: false
        workflow_id:
          type: integer
          example: NDA Workflow
          description: The content for this annotationSourceId will be available only in the identified workflow. Set to null if the annotationSourceId should be available in all workflows.
          required: false
        content:
          type: object
          example:
            party: VoicePhone Limited
            raw_text: Voicephone Ltd.
          required: false
        state:
          type: string
          enum:
          - active
          - deleted
          required: false
    MatterAnnotation:
      type: object
      properties:
        id:
          type: integer
          example: 37495390
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.100Z'
        created_by:
          type: integer
          example: 3
        matter_id:
          type: integer
          example: 7342
        annotation_type_id:
          type: integer
          example: 347
          description: This corresponds to annotationTypeId available when calling the /annotation_types endpoint
        content:
          type: object
          example:
            timestamp: '2027-04-07T00:00:00.000Z'
        state:
          type: string
          enum:
          - active
          - deleted
          example: active
    MatterAnnotationPatch:
      type: object
      properties:
        annotation_type_id:
          type: integer
          example: 400
          required: true
          description: See the api2/annotation_types endpoint for specifics of the annotation_type_ids enabled on your instance.
        content:
          type: object
          properties:
            value:
              type: string
              example: Agreement
          required: false
        state:
          type: string
