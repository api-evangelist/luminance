  responses:
    '429':
      description: Too many requests have been sent to the server over a given time period. Please contact Luminance's support team.
    '401':
      description: Unauthorized - the authentication provided was invalid
    annotation_types_200:
      description: JSON array of annotationType objects available in the instance, or a single JSON annotationSource object if annotationTypeId is referenced in the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnotationType'
          example:
            id: 1
            created_at: '2021-10-25T11:58:31.879Z'
            created_by: 1
            type: entity:datetime
            key: contract:effective
            pre-built: true
            name: Effective Date
            options: {}
    annotation_source_patch_200:
      description: JSON object or array of JSON objects of AnnotationSources after PATCHing to modify one or more AnnotationSource objects
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnotationSource'
          example:
            id: 56
            created_at: '2021-10-25T11:58:31.879Z'
            created_by: 1
            annotation_type_id: 345
            project_id: 2
            workflow_id: 3
            annotation_source_relation_id: null
            content:
              type: object
              example:
                party: VoicePhone Limited
                raw_text: Voicephone Ltd.
            state: active
    annotationText_200:
      description: JSON array of clauses (annotation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnotationText'
          example:
            id: 37225093,
            text: Example clause text.
    '405':
      description: Method not allowed (calling api with wrong method)
    '403':
      description: Forbidden - the authenticated user does not have sufficient permissions to perform this action
    '500':
      description: Internal server error
    annotation_source_create_201:
      description: JSON object of an AnnotationsSource after POSTing to create one
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnotationSource'
          example:
            id: 56
            created_at: '2021-10-25T11:58:31.879Z'
            created_by: 1
            annotation_type_id: 345
            project_id: 2
            workflow_id: 3
            annotation_source_relation_id: null
            content:
              type: object
              example:
                party: VoicePhone Limited
                raw_text: Voicephone Ltd.
            state: active
    '422':
      description: Unprocessable Entity - the request was well formed, but not processable
    annotation_sources_200:
      description: JSON array of annotationSource objects available in the instance, or a single JSON annotationSource object if annotationSourceId is referenced in the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnotationSource'
          example:
            id: 56
            created_at: '2021-10-25T11:58:31.879Z'
            created_by: 1
            annotation_type_id: 345
            project_id: 2
            workflow_id: 3
            annotation_source_relation_id: null
            content:
              type: object
              example:
                party: VoicePhone Limited
                raw_text: Voicephone Ltd.
            state: active
    annotations_200:
      description: JSON array of Annotation objects structured in the below schema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Annotation'
          example:
            id: 37495390
            created_at: '2023-04-19T12:20:39.100Z'
            created_by: 4
            document_id: 369998
            type: entity:party
            roles:
            - Counter-Party
            content:
              party: VoicePhone Limited.
              raw_text: Voicephone Ltd.
            state: active
    matter_annotations_200:
      description: JSON array of Annotation objects structured in the below schema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatterAnnotation'
          example:
            id: 37495390
            created_at: '2023-04-19T12:20:39.100Z'
            created_by: 4
            matter_id: 7342
            annotation_type_id: 347
            content:
              timestamp: '2027-04-07T00:00:00.000Z'
            state: active
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://moniker.app.luminance.com/auth/oauth2/token
