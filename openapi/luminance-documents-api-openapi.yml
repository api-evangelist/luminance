  /api2/projects/{project_id}/documents:
    servers:
    - url: https://{moniker}.app.luminance.com
      description: Your Luminance instance
      variables:
        moniker:
          default: your-instance
          description: Instance moniker (e.g. acme)
    get:
      tags:
      - Documents
      summary: List documents in a project
      parameters:
      - $ref: '#/components/parameters/projectId'
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: folder_id
        schema:
          type: integer
      - in: query
        name: parent_id
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: media_type
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: version_group
        schema:
          type: integer
      - in: query
        name: version
        schema:
          type: integer
      - in: query
        name: version_state
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document_2'
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                folder_id: 1
                parent_id: 1
                project_id: 1
                name: Joe Bloggs
                media_type: application/pdf
