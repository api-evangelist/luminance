openapi: 3.2.0
info:
  title: Luminance Documents API
  version: '1.0'
  description: 'Operations tagged Documents across 3 of this provider''s published API definitions: luminance-api-v1-3-openapi-original.yml, luminance-api-v1-4-openapi-original.yml, luminance-public-api-v2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{moniker}.app.luminance.com
  description: Your Luminance instance
  variables:
    moniker:
      default: your-instance
      description: Instance moniker (e.g. acme)
tags:
- name: Documents
paths:
  /projects/{project-id}/documents:
    get:
      tags:
      - Documents
      summary: Get Information on a Document collection
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/project-id'
      - $ref: '#/components/parameters/documentId'
      - $ref: '#/components/parameters/createdAt'
      - $ref: '#/components/parameters/createdBy'
      - $ref: '#/components/parameters/folderId'
      - $ref: '#/components/parameters/parentId'
      - $ref: '#/components/parameters/documentName'
      - $ref: '#/components/parameters/documentMedia_type'
      - $ref: '#/components/parameters/documentState'
      - $ref: '#/components/parameters/documentVersionGroup'
      - $ref: '#/components/parameters/documentVersion'
      - $ref: '#/components/parameters/documentVersionState'
      security:
      - OAuth2: []
      responses:
        '200':
          $ref: '#/components/responses/documents_200'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
      - Documents
      summary: Delete a collection of Documents.
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/project-id'
      - in: query
        description: Any one or more of the following parameters MUST be used as a query parameter in the deletion request. Please see the 'Document' schema for more information on each parameter
        name: deletionparameters
        required: true
        schema:
          type: object
          properties:
            document_id:
              type: integer
              format: int32
              example: 4638
            created_at:
              type: string
              format: date-time
              example: '2021-10-25T11:58:31.879Z'
            created_by:
              type: integer
              format: int32
              minimum: 0
              example: 5
            folder_id:
              type: integer
              format: int32
              minimum: 0
              example: 8
            parent_id:
              type: integer
              format: int32
              minimum: 0
              example: 3473
            name:
              type: string
              format: string
              minimum: 0
              example: This is a contract.docx
            media_type:
              type: string
              format: string
              minimum: 0
              example: application/vnd.openxmlformats-officedocument.wordprocessingml.document
            state:
              type: string
              enum:
              - import_pending
              - import_complete
              - import_failure
              - upload_failure
              - import_extracted
              - upload_cancelled
              example: import_complete
            version_group:
              type: integer
              format: int32
              minimum: 0
              example: 247
            version:
              type: integer
              format: int32
              minimum: 0
              example: 2
            version_state:
              type: string
              enum:
              - active
              - draft
              - replaced
              example: active
          minProperties: 1
          additionalProperties: false
      security:
      - OAuth2: []
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /projects/{project-id}/documents/{document-id}/traffic_light_analysis:
    post:
      tags:
      - Documents
      summary: Initiates Traffic Light Analysis on a document
      parameters:
      - $ref: '#/components/parameters/document-id'
      - $ref: '#/components/parameters/project-id'
      requestBody:
        description: Send the taskId of the 'precedent' type Task (Knowledge Bank in the User Interface) which will be used to run traffic light analysis against the documentId in the path
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: integer
                  example: 67
              required:
              - task_id
      security:
      - OAuth2: []
      responses:
        '202':
          $ref: '#/components/responses/traffic_light_analysis_202'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '422':
          $ref: '#/components/responses/422'
        '429':
