      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    annotationState:
      name: state
      in: query
      description: State of the annotation
      required: false
      type: string
      enum:
      - active
      - deleted
    annotationTypeOptions:
      name: options
      in: query
      description: Options associated with the annotation, the options field will display available values
