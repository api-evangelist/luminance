        - redacted
        - search
        - source:referenceid
        - source:signed
        - structure:group
        - structure:metadata
        - structure:pagebreak
        - structure:paragraph:joined
        - structure:paragraph:split
        - structure:section
        - title
        - user
        - usertag
    userId:
      name: id
      in: query
      description: Unique User ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    annotationTypeKey:
      name: key
      in: query
      description: Key used to identify the annotation
      required: false
      schema:
        type: string
        format: string
    accountId:
      name: account_id
      in: query
      description: ID of Associated Account this User is Added to
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    annotationTypeId:
      name: annotation_type_id
      in: query
      description: annotationTypeId for a particular MatterAnnotation. Can be queried via the annotation_types
        endpoint
      required: false
      schema:
        type: integer
        example: 64
        minimum: 0
    userName:
      name: username
      in: query
      description: Username used in login credentials
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    workflowId:
      name: id
      in: query
      description: Unique Workflow ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    limit:
      name: limit
      in: query
      description: Maximum number of objects that can be retrieved.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 50
    user-id:
      name: user-id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    createdBy:
      name: created_by
      in: query
      description: User ID of Creator
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 4
    annotationContent:
      name: content
      in: query
      description: The content of a particular annotation, which will be a value depending on the annotation's
        annotationTypeId
      required: false
      schema:
        type: object
        properties:
          value:
            type: string
            example: Agreement
    annotationTypePre-built:
      name: pre-built
      in: query
      description: Whether this annotation is reflects an out-of-the-box Luminance concept ("True"), or
        the concept has been created in your instance ("False")
      required: false
      schema:
        type: boolean
        default: none
    annotationSourceId:
      name: annotation_source_id
      in: query
      description: annotation_source_id for a particular value made available to a users selecting values
        for that an Annotation when interacting with Matters in the user interface
      required: false
      schema:
        type: integer
        example: 76
        minimum: 0
    createdAt:
      name: created_at
      in: query
      description: Time of Creation
      required: false
      schema:
        type: string
        format: date-time
        minimum: 0
