      - Reviews
      summary: Update multiple reviews
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/project-id'
      - $ref: '#/components/parameters/task-id'
      - $ref: '#/components/parameters/documentId'
      - $ref: '#/components/parameters/reviewId'
      - $ref: '#/components/parameters/reviewSyncState'
      - $ref: '#/components/parameters/reviewState'
      - $ref: '#/components/parameters/reviewAssignee'
      - $ref: '#/components/parameters/reviewAssignedAt'
      - $ref: '#/components/parameters/reviewOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  required: false
                  type: string
                  enum:
                  - active
                  - sync_staged
                  - deleted
                  example: active
                review_state:
                  required: false
                  type: string
                  enum:
                  - pending
                  - complete
                  example: pending
                assigned_to:
                  required: false
                  type: integer
                  example: 7
                outcome:
                  required: false
                  type: string
                  enum:
                  - approved
                  - rejected
                  - None
                  description: If the task is of type 'precedent' i.e. a Knowledge Bank, users can set up approvals before
                    a document can pass through a particular workflow stage. This indicates whether those approvals have been
                    completed or rejected.
