      description: Display name of Matter
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    matterState:
      name: state
      in: query
      description: Current State of Matter
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    matterInfo:
      name: info
      in: query
      description: Information about the matter hidden in the user interface
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    matterVersionId:
      name: id
      in: query
      description: Version ID of a version of a document contained in a matter
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matterVersionState:
      name: state
      in: query
      description: Current State of the matter version
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    matterVersionAssignedTo:
      name: assigned_to
      in: query
      description: User ID of the user a matter is assigned to
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matterVersionAssignedAt:
      name: assigned_at
      in: query
      description: Date and time the matter version was last assigned to a user
      required: false
      schema:
        type: string
        format: date-time
        minimum: 0
    matterVersionName:
      name: name
      in: query
      description: Information about the matter hidden in the user interface
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    matterVersionInfo:
      name: info
      in: query
      description: State
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    matterVersionType:
      name: type
      in: query
      type: string
      example: attachment
      required: false
      enum:
      - attachment
      - draft
      - version
      description: An attachment is not part of a matter's version history, but is typically used to store supporting documentation.
        A new 'version' is a new document saved as a new version, while a 'draft' version is an updated copy of the previous
        'version' type group version.
    matterRelationId:
      name: id
      in: query
      description: ID of the relation a source matterId has to a target matterId
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matterAnnotationId:
      name: id
      in: query
      description: Annotation ID of an Annotation attached to a Matter
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matterAnnotationState:
      name: state
      in: query
      description: State of an Annotation attached to a Matter
      required: false
      schema:
        type: string
        enum:
        - active
        - deleted
    sourceId:
      name: source_id
      in: query
      description: matterId of the matter which is the source of the relationship in a particular matter relation
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    targetId:
      name: target_id
      in: query
      description: matterId of the matter which is the target of the relationship in a particular matter relation
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    enable_token_based_linking:
      name: enable_token_based_linking
      in: query
      description: Whether to download a document with tokens added which will allow the document to be identified to its
        matter/Knowledge Bank in the Word Plugin or not. a 'true' value is only accepted if the document media_type is .doc
        or .docx.
      required: false
      schema:
        type: boolean
        format: boolean
        minimum: 0
    documentTemplateId:
      name: id
      in: query
      description: ID of a specific document template (document template in the user interface)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    documentTemplateName:
      name: name
      in: query
      description: Name of a specific document template
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    documentTemplateFieldId:
      name: id
      in: query
      description: ID of a specific document template field
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    documentTemplateState:
      in: query
      name: state
      required: false
      type: string
      enum: active deleted
      example: active
    documentTemplateFieldName:
      in: query
      name: name
      description: Name of a specific document template
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    documentTemplateFieldKey:
      name: key
      in: query
      description: Name of a specific document template field. Corresponds to its name on the document template itself
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    documentTemplateFieldDataType:
      name: datatype
      in: query
      description: Data type accepted by that field - will usually be generic:text, which is free text
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    documentTemplateFieldOrder:
      name: field_order
      in: query
      description: Where positionally the field is on the document template, top to bottom and left to right
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    documentTemplateFieldParentDataFieldId:
      name: parent_data_field_id
      in: query
      description: The documentTemplateFieldId of the field this field is a child of, for example in a nested loop.
      required: false
      schema:
        type: string
        minimum: 0
    documentTemplateFieldOptions:
      name: options
      in: query
      description: This is where options for the field are stored.
      required: false
      type: object
    defaultFolderId:
      name: default_folder_id
      in: query
      description: The folderId which documents created using this template will be saved to
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    mediaType:
      name: media_type
      in: query
      description: The media type of the file in the documentTemplate object. Will always be an MS Word MIME type
      required: false
      schema:
        type: string
        format: string
        minimum: 0
        example: application/vnd.openxmlformats-officedocument.wordprocessingml.document
    documentTemplateOptions:
      name: options
      in: query
      description: Configuration options for the document template
      required: false
      schema:
        type: object
        example:
          old_template: true
    async:
      name: async
      in: query
      description: Whether to make the call synchronously or wait for the precedent type task to be created asynchronously
        when creating a Knowledge Bank from template.
      required: true
      schema:
        type: boolean
        format: boolean
        minimum: 0
    userName:
      name: username
      in: query
      description: Username used in login credentials
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    moniker:
      name: moniker
      in: query
      description: Shortened Name of Project or Workflow
      required: false
      schema:
        type: string
    ProjectName:
      name: name
      in: query
      description: Name of Project
      required: false
      schema:
        type: string
    TaskName:
      name: name
      in: query
      description: Name of Task
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    folderName:
      name: name
      in: query
      description: Name of Folder
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    taskType:
      name: type
      in: query
      description: Type of Task - Knowledge Banks are 'precedent' type tasks
      required: false
      schema:
        type: string
        enum:
        - task
        - precedent
        - alert
        - comparison
    projectType:
      name: type
      in: query
      description: Product type
      schema:
        type: string
        enum:
        - diligence
        - discovery
        - corporate
    folderType:
      name: type
      in: query
      description: Folder type
      schema:
        type: string
        enum:
        - folder
        - custodian
        description: Folder is the default value while Custodian can be useful if the folder is used to denote where the document
          has come from in Discovery projects.
        default: folder
    userState:
      name: state
      in: query
      description: Current State of User
      required: false
      schema:
        type: string
        format: string
        minimum: 0
        enum:
        - active
        - disabled
    folderState:
      name: state
      in: query
      description: Current State of Folder
      required: false
      schema:
        type: string
        format: string
        minimum: 0
        enum:
        - active
        - deleted
    projectState:
      name: state
      in: query
      description: Current State of Project
      required: false
      schema:
        type: string
        enum:
        - active
        - disabled
        - deleted
    reviewSyncState:
      name: state
      in: query
      description: Whether the document is active, there is a sync_staged for it (the document has been flagged to appear
        in the task but not added yet), or had a review which has been deleted
      required: false
      schema:
        type: string
        enum:
        - active
        - sync_staged
        - deleted
    reviewState:
      name: review_state
      in: query
      description: Whether the document has been completely reviewd (complete) or is pending review (pending)
      required: false
      schema:
        type: string
        enum:
        - pending
        - complete
    projectPermissions:
      name: permissions
      in: query
      description: Granted Download Permissions of Project Documents
      required: false
      schema:
        type: string
        enum:
        - none
        - preview
        - native
    projectSettings:
      name: settings
      in: query
      description: Enabled Annotation Types
      required: false
      schema:
        $ref: '#/components/schemas/ProjectSettings'
    projectFeatures:
      name: features
      in: query
      description: Additional Features Available in this Project
      schema:
        type: array
        items:
          type: string
    taskDescription:
      name: description
      in: query
      description: Task Description
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    auto_sync:
      name: auto_sync
      in: query
      description: If auto-sync is automatic (true) or staging (false). If this is set to null then no auto-sync is run
      required: false
      schema:
        type: boolean
        format: boolean
        minimum: 0
    mfaEnabled:
      name: multi_factor_auth_enabled
      in: query
      description: If `true` MFA is Enabled for this User
      required: false
      schema:
        type: boolean
        format: boolean
        minimum: 0
    annotationTypeId:
      name: annotation_type_id
      in: query
      description: annotationTypeId for a particular MatterAnnotation. Can be queried via the annotation_types endpoint
      required: false
      schema:
        type: integer
        example: 64
        minimum: 0
    annotationSourceId:
      name: annotation_source_id
      in: query
      description: annotation_source_id for a particular value made available to a users selecting values for that an Annotation
        when interacting with Matters in the user interface
      required: false
      schema:
        type: integer
        example: 76
        minimum: 0
    annotationSourceRelationId:
      name: annotation_source_relation_id
      in: query
      description: annotation_source_relation_id is not currently an interactable element via the API
      required: false
      schema:
        type: integer
        example: 76
        minimum: 0
    annotationTextId:
      name: id
      in: query
      required: true
      description: This parameter refers to the annotationId you wish to retrieve the underlying text from the Document on.
        It should be repeated to return results from multiple annotationIds
      schema:
        type: integer
        format: int32
        example: 6238
  schemas:
    System:
      type: object
      properties:
        version:
          type: number
          example: 1.16.0
        api2_version:
          type: number
          example: 1.2.0
        product:
          type: string
          example: corporate
    User:
      type: object
      properties:
        id:
          type: integer
          example: 4
        created_at:
          type: string
          format: date-time
          example: '2022-12-01T10:21:04.589Z'
        username:
          type: string
          example: luminance.cto
        name:
          type: string
          example: Luminance CTO
        email:
          type: string
          default: null
          example: luminance.cto@luminance.com
        account_id:
          type: integer
          example: 2
        state:
          type: string
          example: active
          enum:
          - active
          - disabled
        multi_factor_auth_enabled:
          type: boolean
          example: false
    Project:
      type: object
      properties:
        id:
          type: integer
          example: 4
        created_at:
          type: string
          format: date-time
          example: '2022-12-01T10:21:04.589Z'
        created_by:
          type: integer
          example: 1
        moniker:
          type: string
          example: voicep
        name:
          type: string
          example: VoicePhone Project
        account_id:
          type: integer
          example: 2
        state:
          type: string
          example: disabled
          enum:
          - active
          - deleted
          - disabled
        permissions:
          type: string
          enum:
          - none
          - preview
          - native
          example: native
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        type:
          type: string
          example: diligence
          enum:
          - corporate
          - diligence
          - discovery
        features:
          type: array
          example:
          - bulkredact
          items:
            type: string
    ProjectSettings:
      type: object
      properties:
        tags:
          type: array
          items:
            type: integer
          description: array of strings with the names of note categories enabled on the specific project
          example:
          - Legal Analysis
          - Flagged for Followup
        task_tags:
          type: array
          items:
            type: integer
          description: array of strings with the names of task categories enabled on the specific project
          example:
          - Review Task Level 1
          - Review Task Level 2
        annotation_types:
          type: object
          description: An object describing the annotation type IDs enabled on a project for
          properties:
            bundles:
              type: array
              items:
                type: integer
              description: Array of pre-configured tag bundles added to the Project
              example:
              - Corporate
            custom:
              type: array
              items:
                type: integer
              description: Array of custom Annotation Type IDs added to the project instead of using bundles
              example:
              - 25
              - 35
        required_matter_tags:
          type: array
          items:
            type: integer
          description: May be populated in the case of Corporate type projects, these matter tags must be added to any newly
            created matters using the matters/create endpoint
          example:
          - 311
        concept_tags_blacklist:
          type: array
          items:
            type: integer
          description: Array of Annotation type IDs which cannot be tagged in the particular project
          example:
          - 20
          - 35
        matter_tags:
          type: array
          items:
            type: integer
          description: Populated in the case of Corporate type projects, an array of Annotation Type IDs enabled on the project
            specifically to categorise matter objects
          example:
          - 46
          - 78
    ProjectUsers:
      type: object
      properties:
        id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2021-10-25T12:35:02.385Z'
        project_id:
          type: integer
          example: 3
        user_id:
          type: integer
          example: 8
        type:
          type: string
          enum:
          - admin
          - standard
        roles:
          type: array
          example:
          - admin
          - power
    KnowledgeBankFromTemplate:
      type: object
      description: Payload necessary to create a knowledge bank from a specified document ID of the specified contract type
      properties:
        document_id:
          type: integer
          example: 698
          description: The document ID to find positional information in and generate a knowledge bank from
        contract_type:
          type: string
          enum:
          - non%2Ddisclosure-agreement
          - services-agreement
          example: non%2Ddisclosure-agreement
          description: Select the from the available Luminance contract type modules which can be used to generate positions
            from ontracts of that type
        include_luminance_basis:
          type: boolean
          example: false
          description: Whether or not to include standard Luminance position information in this knowledge bank from the selected
            module, or only to use position information found in the specified document ID
        name:
          type: string
          example: New Knowledge Bank from for Master Services Agreement
          description: the name for the new Knowledge Bank created
    Task:
      type: object
      properties:
        id:
          type: integer
          example: 53
        created_at:
          type: string
          format: date-time
          example: '2023-02-01T10:11:04.678Z'
        created_by:
          type: integer
          example: 9
        moniker:
          type: string
          example: reviewnda
        name:
          type: string
          example: Review NDAs
        project_id:
          type: integer
          example: 5
        parent_id:
          type: integer
          example: 2
        description:
          type: string
          example: null
        workspace_id:
          type: integer
          example: 6
          description: ID of the workspace the task is associated with, if present, associated only with Discovery type projects
        settings:
          type: object
          example:
            last_synced: '2023-05-17T11:49:18.240Z'
            completionConditions: []
        filter:
          type: object
          description: Object containing filters attached to the task to automatically or manually identify and create task
            reviews for document objects matching the filters and uploaded to the project
          example:
            op: and
            analyze: true
            annotation:0.type: i:commercial-and-operations
        full_families:
          type: boolean
          example: false
          description: Boolean value indicating whether the task was created to include full 'families' of parent/attachment
            document relations or not
        auto_sync:
          type: boolean
          example: false
          description: Boolean value indicating whether reviews are automatically created in the task for document objects
            matching the 'filter's or not
        type:
          description: Type of Task - Knowledge Banks are 'precedent' type tasks
          required: false
          type: string
          enum:
          - task
          - precedent
          - alert
          - comparison
        tags:
          required: false
          type: array
          items:
            type: string
          example:
          - Review Level 1
          - Review Level 2
    Review:
      type: object
      properties:
        id:
          type: integer
          example: 77
        created_at:
          type: string
          format: date-time
          example: '2018-12-21T14:49:38.331Z'
        created_by:
          type: integer
          example: 4
        document_id:
          type: integer
          example: 7342
        state:
          type: string
          enum:
          - active
          - deleted
          example: active
        review_state:
          type: string
          enum:
          - pending
          - complete
          example: pending
        assigned_to:
          type: integer
          example: 7
        assigned_at:
          type: string
          format: date-time
          example: '2018-12-21T14:49:51.292Z'
        outcome:
          type: string
          enum:
          - approved
          - rejected
          - None
          description: If the task is of type 'precedent' i.e. a Knowledge Bank, users can set up approvals before a document
            can pass through a particular workflow stage. This indicates whether those approvals have been completed or rejected.
    FolderPost:
      type: object
      properties:
        parent_id:
          type: integer
          example: 52597
          description: ID of the folder the new folder will be created in
        name:
          type: string
          example: Foo Folder
          description: Name for the new folder
        type:
          type: string
          example: folder
          enum:
          - folder
          - custodian
          description: Folder is the default value while Custodian can be useful if the folder is used to denote where the
            document has come from in Discovery projects.
          default: folder
      required:
      - parent_id
      - name
    FolderPatch:
      type: object
      properties:
        name:
          type: string
          example: All Documents
          required: false
        media_type:
          type: string
          default: null
          example: null
          required: false
        state:
          type: string
          example: active
          enum:
          - active
          - deleted
          required: false
        type:
          type: string
          enum:
          - custodian
          - folder
          description: Folder is the default value while Custodian can be useful if the folder is used to denote where the
            document has come from in Discovery projects.
          default: folder
          example: folder
          required: false
    Folder:
      type: object
      properties:
        id:
          type: integer
          example: 52597
        created_at:
          type: string
          format: date-time
          example: '2022-09-21T11:56:08.195Z'
        created_by:
          type: integer
          example: 4
        parent_id:
          type: integer
          default: null
          example: null
        name:
          type: string
          example: All Documents
        media_type:
          type: string
          default: null
          example: null
        project_id:
          type: integer
          example: 444
        state:
          type: string
          example: active
          enum:
          - active
          - deleted
        type:
          type: string
          enum:
          - custodian
          - folder
          description: Folder is the default value while Custodian can be useful if the folder is used to denote where the
            document has come from in Discovery projects.
          default: folder
          example: folder
    Workflow:
      type: object
      properties:
        id:
          type: integer
          example: 415
          description: unique workflowId
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        created_by:
          type: integer
          example: 32
        moniker:
          type: string
          example: nda
          description: Short name for the workflow
        name:
          type: string
          example: NDA Workflow
        project_id:
          type: integer
          example: 6
    Matters:
      type: object
      properties:
        id:
          type: integer
          example: 415
          description: unique Matter Id
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        created_by:
          type: integer
          example: 32
        project_id:
          type: integer
          format: int32
          example: 4
        name:
          type: string
          example: New Matter
        state:
          type: string
          enum:
          - active
          - deleted
        info:
          type: array
          example: {}
          description: Not typically used to store data.
    MatterRelation:
      type: object
      properties:
        id:
          type: integer
          example: 415
          description: unique Matter Relation
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        created_by:
          type: integer
          example: 32
        source_id:
          type: integer
          format: int32
          example: 4
          description: Unique matter_id of the matter being related
        target_id:
          type: integer
          format: int32
          example: 4
          description: Unique matter_id of the second matter in the relationship
    MatterVersion:
      type: object
      properties:
        id:
          type: integer
          example: 415
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        created_by:
          type: integer
          example: 32
        updated_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.200Z'
        updated_by:
          type: integer
          example: 32
        group_id:
          type: integer
          example: 1
          description: This is the matterId the version is assigned to
        workflow_stage_id:
          type: integer
          example: 1
          description: This is the Workflow stage ID in the workflow editor the matter is in.
        type:
          type: string
          enum:
          - attachment
          - draft
          - version
          description: An attachment is not part of a matter's version history, but is typically used to store supporting
            documentation. A new 'version' is a new document saved as a new version, while a 'draft' version is an updated
            copy of the previous 'version' type group version.
        state:
          type: string
          enum:
          - active
          - inactive
          - deleted
          - executed
          description: An active matter version is the most recent draft or version type version of the contratc on the matter.
            Inactive versions are earlier in time than the most recent draft or version. An executed version has progressed
            to the end of a workflow and been executed. An attachment type version will always be inactive. Deleted versions
            mean the matter itself has been deleted.
        assigned_to:
          type: integer
          example: 5
          description: userId of the user the matter version is assigned to. Can be 'None'.
        assigned_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.300Z'
        info:
          type: array
          example: {}
          description: Not typically used to store data.
    MatterVersionsAssignableUsers:
      type: object
      properties:
        name:
          type: string
          example: Support User
          description: userName of the Assignable user
        id:
          type: integer
          example: 4
          description: userID of the Assignable user
    MatterAnnotation:
      type: object
      properties:
        id:
          type: integer
          example: 37495390
        created_at:
          type: string
          format: date-time
          example: '2023-04-19T12:20:39.100Z'
        created_by:
          type: integer
          example: 3
        matter_id:
          type: integer
          example: 7342
        annotation_type_id:
          type: integer
          example: 347
          description: This corresponds to annotationTypeId available when calling the /annotation_types endpoint
