      - $ref: '#/components/parameters/project-id'
      requestBody:
        required: true
        content:
          application/json:
            description: Define the documentId which will have a review created for it in the relevant task
            schema:
              type: object
              properties:
                document_id:
                  type: integer
                  example: 83049
            example:
              document_id: 83049
      security:
      - OAuth2: []
      responses:
        '201':
          $ref: '#/components/responses/review_201'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
