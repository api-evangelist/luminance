  /projects/{project-id}/folders/{folder-id}/upload:
    post:
      tags:
      - Documents
      summary: Upload a single document to a specific folder path
      parameters:
      - $ref: '#/components/parameters/project-id'
      - $ref: '#/components/parameters/folder-id'
      - in: query
        name: matter_id
        type: integer
        example: 675
        description: matterId of the matter you wish to upload the document into.
      - $ref: '#/components/parameters/matterVersionType'
      - in: query
        name: name
        required: true
        description: Name of document
        schema:
          type: string
          format: string
          minimum: 0
        example: This is a contract.docx
      - in: query
        name: replace
        required: false
        description: Whether, if a document of the same name already exists in the current folder, to 'replace' that document
          (existing document will be set to version_state:replaced, and version_group will change to the document_id of the
          document being uploaded), or if 'false' will return a 422 error code and the request will not complete.
        schema:
          type: boolean
          default: false
        example: This is a contract.docx
      description: The body of the request should contain the file you wish to upload, as a base64 encoded string.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: byte
