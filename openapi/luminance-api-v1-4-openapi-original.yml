openapi: 3.0.0
info:
  version: 1.4.0
  title: Luminance API
  description: <h2>Overview</h2>Luminance offers a RESTful HTTP-based API utilizing JSON as the primary serialization format
    and OAuth2 for authentication. This API is engineered to seamlessly integrate your software with the Luminance Platform,
    leveraging its objects and endpoints to enhance your applications.<br><br>With this API, you can create integrations that
    allow direct access to folders, tasks, and documents stored in Luminance. Additionally, you can track document progress
    through reviews or utilize machine learning capabilities via annotations and Traffic Light Analysis.<br><br>The Luminance
    API is designed with developers in mind, providing comprehensive documentation and robust support to ensure smooth integration.
    It adheres to industry standards, ensuring compatibility and security. Developers can take advantage of the API's flexibility
    to build custom solutions, automate workflows, and enhance overall efficiency within their applications.<br><br><strong>API
    requests are rate limited for security reasons to 100 requests every 10 minutes.</strong><br><br><strong>This version
    of the API is deployed by standard to Luminance product versions 1.43.0 onwards</strong><h2>Objects</h2><ul><li>**<a href='/api_docs/documentation/accounts#endpoints'>Accounts</a>:**
    These actions are made at the top    Account-level of Luminance, which requires Administrator permissions for the Service
    user performing the action</li><li>**<a href='/api_docs/documentation/users#endpoints'>Users</a>:** This refers to the
    users on your Luminance    account. Their level of access will depend on their permissions.</li><li>**<a href='/api_docs/documentation/projects'>Projects</a>:**
    This refers to the different projects that are    stored within your Luminance account.</li><li>**<a href='/api_docs/documentation/tasks#endpoints'>Tasks</a>:**
    Tasks are collections of documents within a    project that can be assigned to a subset of users.</li><li>**<a href='/api_docs/documentation/reviews#endpoints'>Reviews</a>:**
    This refers to the 'review' object created to track review status of documents    by users within a task, and store AI
    outputs from Traffic Light Analysis through a Knowledge Bank.</li><li>**<a href='/api_docs/documentation/folders#endpoints'>Folders</a>:**
    This refers to the folders the documents    are stored in within the project.</li><li>**<a href='/api_docs/documentation/documents#endpoints'>Documents</a>:**
    These are the documents on your    Luminance account. Documents can be accessed via their projects, folders or the tasks
    they have been added in    to.</li><li>**<a href='/api_docs/documentation/annotations#endpoints'>Annotations</a>:** Annotations
    refer to all the types    of data tags that can be added to a document. They can be accessed via the document they are
    on via the    document's project, folder, or task.</li><li>**<a href='/api_docs/documentation/matters#endpoints'>Matters</a>:**
    Matters are containers used in live negotiations to store document versioning information and assist in managing workflows.
    Our matter endpoints allow for management of these matters, including data tags associated with these matters, programmatically</li><li>**<a
    href='/api_docs/documentation/matterversions#endpoints'>Matter Versions</a>:** An object referencing a single document
    in a matter. This could be single draft of a contract or a related document such as an attachment.</li><li>**<a href='/api_docs/documentation/trafficlightanalysis#endpoints'>Traffic
    Light Analysis</a>:**The Traffic Light Analysis endpoint is able to trigger analysis of a document using Luminance's AI
    analysis tool to see how compliant the clauses in a document are with your standard positioning</li><li>**<a href='/api_docs/documentation/contractcreation#endpoints'>Contract
    Creation</a>:**Get information on, and create contracts with a new associated matter using the templates hosted in a particular
    division by calling these endpoints.</li></ul>
tags:
- name: Accounts
- name: Users
- name: Projects
- name: Tasks
- name: Reviews
- name: Folders
- name: Documents
- name: Annotations
- name: Workflows
- name: Matters
- name: Matter Versions
- name: Traffic Light Analysis
- name: Contract Creation
