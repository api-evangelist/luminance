components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://moniker.app.luminance.com/auth/oauth2/token
  parameters:
    annotation-type-id:
      name: annotation-type-id
      in: path
      description: Annotation Type ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    user-id:
      name: user-id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    project-id:
      name: project-id
      in: path
      description: Project ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    task-id:
      name: task-id
      in: path
      description: Task ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    review-id:
      name: review-id
      in: path
      description: Review ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    document-id:
      name: document-id
      in: path
      description: Document ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    matter-id:
      name: matter-id
      in: path
      description: Matter Id
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    matter-version-id:
      name: matter-version-id
      in: path
      description: Matter Version Id
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    folder-id:
      name: folder-id
      in: path
      description: Folder ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    annotation-id:
      name: annotation-id
      in: path
      description: Annotation ID
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    project-user-id:
      name: id
      in: query
      description: ID of the user permission object
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    document-template-id:
      name: document-template-id
      in: path
      description: ID of a specific document template (document template in the user interface)
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
    limit:
      name: limit
      in: query
      description: Maximum number of objects that can be retrieved.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 50
    userId:
      name: id
      in: query
      description: Unique User ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    workflowId:
      name: id
      in: query
      description: Unique Workflow ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    projectId:
      name: id
      in: query
      description: Unique Project ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    taskId:
      name: id
      in: query
      description: Unique Task ID(s)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    reviewId:
      name: id
      in: query
      description: Unique Review ID(s)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    folderId:
      name: folder_id
      in: query
      description: Unique Folder ID(s)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 6
    documentName:
      name: name
      in: query
      description: Name of document
      required: false
      schema:
        type: string
        format: string
        minimum: 0
      example: This is a contract.docx
    workflowName:
      name: name
      in: query
      description: Name of workflow
      required: false
      schema:
        type: string
        format: string
        minimum: 0
      example: NDA Workflow
    documentMedia_type:
      name: media_type
      in: query
      description: MIME type detected for the document
      required: false
      schema:
        type: string
        format: string
        minimum: 0
      example: application/vnd.openxmlformats-officedocument.wordprocessingml.document
    documentState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
        - import_pending
        - import_complete
        - import_failure
        - upload_failure
        - import_extracted
        - upload_cancelled
      description: An 'upload_cancelled' document has been indexed by Luminance, but the upload was cancelled by the user
        while the process was occurring/. 'upload_failure' documents were not cancelled by the user, but the upload failed
        for some reason, for example an internet connection dropping. An 'import_pending' document has been uploaded but not
        analysed by Luminance's AI yet, which happens automatically to turn the document into an 'import_complete' document
        with document/annotations. If the document cannot be analysed, it becomes 'import_failure'.
      example: import_complete
    documentVersionGroup:
      name: version_group
      in: query
      type: integer
      required: false
      minimum: 0
      description: When a file with the same filename as another document in a particular folder, is uploaded to that folder,
        the existing document is set to document_versionState = 'replaced'. The new document version_group is set to the documentId
        of the 'replaced' document.
      example: 256
    documentVersion:
      name: version
      in: query
      type: integer
      required: false
      minimum: 0
      description: if a file 'replaces' another file, its version will increment.
      example: 2
    documentVersionState:
      name: version_state
      in: query
      required: false
      schema:
        type: string
        enum:
        - active
        - draft
        - replaced
      description: When a file with the same filename as another document in a particular folder, is uploaded to that folder,
        the existing document is set to document_versionState = 'replaced'. The new document version_group is set to the documentId
        of the 'replaced' document. A 'draft' type version_state indicates the document is currently checked out via the Word
        Plugin and open for editing.
      example: active
    parentId:
      name: parent_id
      in: query
      description: If the document is part of a family of attachments, e.g. a document embedded on a PDF file or attached
        to an email
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    documentId:
      name: id
      in: query
      description: Unique Document ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 654
    documentReviewId:
      name: document_id
      in: query
      description: Unique Document ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 654
    annotationId:
      name: id
      in: query
      description: Unique Annotation ID
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matterAnnotationTypeId:
      name: id
      in: query
      description: Unique Annotation Type ID for the Annotation attached to the Matter, can also be queried via the /annotation_types
        endpoint
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    annotationType:
      name: type
      in: query
      description: Type of data stored by the annotation e.g. 'language'
      required: false
      schema:
        type: string
        enum:
        - alert
        - alias
        - contract:state
        - contracttype
        - definedterm:definition
        - definedterm:use
        - document:bates
        - document:cluster
        - document:custodian
        - document:duplicationfamily
        - document:family
        - document:privileged
        - document:relation
        - document:textinfo
        - documenttype
        - email:chain
        - email:type
        - emailaddress
        - entity:area
        - entity:boolean
        - entity:custom
        - entity:datetime
        - entity:enum
        - entity:identifier
        - entity:law
        - entity:location
        - entity:money
        - entity:organization
        - entity:party
        - entity:percent
        - entity:person
        - entity:signature
        - entity:term
        - entity:timeperiod
        - folder
        - fragment:clause
        - fragment:cluster
        - generic:boolean
        - generic:enum
        - generic:number
        - generic:text
        - language
        - page
        - pagecount
        - qa:antivirus
        - qa:blankpage
        - qa:contentextraction
        - qa:emptycontent
        - qa:encrypted
        - qa:hiddencells
        - qa:missingmodel
        - qa:ocr
        - qa:paragraphing
        - qa:partiallyindexed
        - qa:render
        - qa:restrictedfileformat
        - qa:unsupportedfileformat
        - redacted
        - search
        - source:referenceid
        - source:signed
        - structure:group
        - structure:metadata
        - structure:pagebreak
        - structure:paragraph:joined
        - structure:paragraph:split
        - structure:section
        - title
        - user
        - usertag
    annotationState:
      name: state
      in: query
      description: State of the annotation
      required: false
      type: string
      enum:
      - active
      - deleted
    annotationRoles:
      name: roles
      in: query
      description: There will only ever be a single value in the role field for annotations. This corresponds to annotationTypeKey
        available when calling the /annotation_types endpoint
      required: false
      schema:
        type: array
        example:
        - contract-effective
    projectUserId:
      name: id
      in: query
      description: ID of the user permission object
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    projectUserType:
      name: type
      in: query
      description: Type of the user in the user permission object, either 'admin' (Account Administrator) or 'standard'
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    projectUserRoles:
      name: roles
      in: query
      description: Array of user permissions assigned to the user in the project defined in the user permissions object. A
        user may have multiple permission roles in a single project.
      required: false
      schema:
        type: array
        items:
          type: string
    annotationTypeKey:
      name: key
      in: query
      description: Key used to identify the annotation
      required: false
      schema:
        type: string
        format: string
    annotationTypePre-built:
      name: pre-built
      in: query
      description: Whether this annotation is reflects an out-of-the-box Luminance concept ("True"), or the concept has been
        created in your instance ("False")
      required: false
      schema:
        type: boolean
        default: none
    annotationTypeName:
      name: name
      in: query
      description: The display name for the annotation in platform
      required: false
      schema:
        type: string
        format: string
        minimum: 0
    annotationTypeOptions:
      name: options
      in: query
      description: Options associated with the annotation, the options field will display available values if the type is
        generic:enum.
      required: false
      schema:
        type: array
        items:
          type: string
    fullParagraph:
      name: fullParagraph
      in: query
      description: Indicate whether you would like to extract the entire paragraph that a tag is found within, or just the
        tag itself
      required: false
      schema:
        type: boolean
        default: false
    accountId:
      name: account_id
      in: query
      description: ID of Associated Account this User is Added to
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    folderParentId:
      name: parent_id
      in: query
      description: The folder Id of the Parent Folder
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    required_matter_annotations:
      name: required_matter_annotations
      in: body
      description: Array of required tags configured in a particular project as mandatory for matter creation
      required: false
      schema:
        type: array
        minimum: 0
        items:
          type: integer
    createdAt:
      name: created_at
      in: query
      description: Time of Creation
      required: false
      schema:
        type: string
        format: date-time
        minimum: 0
      example: '2021-10-25T11:58:31.879Z'
    reviewAssignedAt:
      name: created_at
      in: query
      description: Time of Task Allocation
      required: false
      schema:
        type: string
        format: date-time
        minimum: 0
    annotationContent:
      name: content
      in: query
      description: The content of a particular annotation, which will be a value depending on the annotation's annotationTypeId
      required: false
      schema:
        type: object
        properties:
          value:
            type: string
            example: Agreement
    createdBy:
      name: created_by
      in: query
      description: User ID of Creator
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 4
    reviewAssignee:
      name: assigned_to
      in: query
      description: User ID of Assignee
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    reviewOutcome:
      name: outcome
      in: query
      description: If the task is of type 'precedent' i.e. a Knowledge Bank, users can set up approvals before a document
        can pass through a particular workflow stage. Each individual approval has a separate taskReview which can be set
        to completed or rejected. Once all are complete, the document can pass through certain workflow stages.
      required: false
      schema:
        type: string
        enum:
        - approved
        - rejected
        - None
    matterId:
      name: id
      in: query
      description: Matter ID of Matter
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    matterName:
      name: name
