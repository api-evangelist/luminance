      type: object
      properties:
        id:
          type: integer
          example: 12411
          description: Unique ID for the document assigned by Luminance
        created_at:
          type: string
          format: date-time
          example: '2023-01-17T18:10:46.532Z'
        created_by:
          type: integer
          example: 4
        folder_id:
          type: integer
          example: 7342
        parent_id:
          type: integer
          example: 7342
          description: if the document is part of a family of attachments, e.g. a document embedded on a PDF file or attached
            to an email
        project_id:
          type: integer
          example: 455
        name:
          type: string
          example: Template NDA.pdf
        media_type:
          type: string
          example: application/pdf
        state:
          type: string
          enum:
          - import_pending
          - import_complete
          - import_failure
          - upload_failure
          - import_extracted
          - upload_cancelled
          description: An 'upload_cancelled' document has been indexed by Luminance, but the upload was cancelled by the user
            while the process was occurring/. 'upload_failure' documents were not cancelled by the user, but the upload failed
            for some reason, for example an internet connection dropping. An 'import_pending' document has been uploaded but
            not analysed by Luminance's AI yet, which happens automatically to turn the document into an 'import_complete'
            document with document/annotations. if the document cannot be analysed, it becomes 'import_failure'.
        version_group:
          type: integer
          example: 345328
          description: When a file with the same filename as another document in a particular folder, is uploaded to that
            folder, the existing document is set to document_versionState = 'replaced'. The new document version_group is
            set to the documentId of the 'replaced' document.
        version:
          type: integer
          example: 1
          description: if a file 'replaces' another file, its version will increment.
        version_state:
          type: string
          enum:
          - active
          - draft
          - replaced
          description: When a file with the same filename as another document in a particular folder, is uploaded to that
            folder, the existing document is set to document_versionState = 'replaced'. The new document version_group is
            set to the documentId of the 'replaced' document. A 'draft' type version_state indicates the document is currently
            checked out via the Word Plugin and open for editing.
    DocumentTemplateCreate:
      type: object
      properties:
        id:
          type: integer
          example: 12411
          description: Unique ID for the Document object created
        name:
          type: string
          example: '2023-01-17T18:10:46.532Z'
          description: Filename for the Document object created
        project_id:
          type: integer
          example: 4
          description: Unique projectId for the project the document has been created in
        folder_id:
          type: integer
          example: 7342
          description: folderId of the Folder object the document has been created in
        version:
          type: integer
          example: 45
          description: This is the documentVersion for the newly created Document object, not related to matterVersion
        versionMatter:
          type: integer
          example: 45
          description: This is the documentVersionMatter for the newly created Document object, not related to matterVersion
    DocumentTemplates:
      type: object
      properties:
        id:
          type: integer
          example: 12411
          description: Unique ID for the DocumentTemplate assigned by Luminance
        created_at:
          type: string
          format: date-time
          example: '2023-01-17T18:10:46.532Z'
        created_by:
          type: integer
          example: 4
        name:
          type: string
          example: NDA Contract template
        default_folder_id:
          type: integer
          example: 7342
        media_type:
          type: string
          example: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        project_id:
          type: integer
          example: 6
        state:
          type: string
          enum:
          - active
          - deleted
        options:
          type: object
          example:
            old_template: true
    DocumentTemplateFields:
      type: object
      properties:
        id:
          type: integer
          example: 12411
          description: ID of a specific document template field
        created_at:
          type: string
          format: date-time
          example: '2023-01-17T18:10:46.532Z'
        created_by:
          type: integer
          example: 4
        name:
          type: string
          example: NDA Clause text
          description: Name of a specific document template
        key:
          type: string
          description: Name of a specific document template field. Corresponds to its name on the document template itself
          example: _d1_NDA_Clause_Text
        field_order:
          type: integer
          format: int32
          example: 3
          description: Where positionally the field is on the document template, top to bottom and left to right
        document_template_id:
          type: integer
          example: 2
        parent_data_field_id:
          type: integer
          format: int32
          description: The documentTemplateFieldId of the field this field is a child of, for example in a nested loop.
        datatype:
          type: string
          description: Data type accepted by that field - will usually be generic:text, which is free text
          example: generic:text
        options:
          type: object
          properties:
            presets:
              type: array
              items:
                type: string
              example: []
            isVirtual:
              type: boolean
              example: true
            isSingleInputonly:
              type: boolean
              example: true
              description: Attributes in a clause loop will have this property indicating, if the value is True, that multiple
                of these fields can be entered and looped
            singleinputFieldKey:
              type: string
              example: clause_text
              description: indicates the muteable field key that should be used in the DocumentTemplatePayload, which will
                be specific to each document template.
        type:
          type: string
          enum:
          - loop
          - datatag
          - value
          description: Each field will be of the type 'loop', 'datatag' or 'value'. The only field types which need to be
            considered when making a POST request to create a contract, are the 'datatag' type tags
        conditions:
          type: object
          properties:
            parent_data_field_key:
              type: string
              example: null
          description: In a 'value' type DocumentTemplateField, the parent_data_field_key will specify the DocumentTemplateFieldskey
            of the 'loop' type field item, if the field can accept multiple values as it is nested in a loop. Other DocumentTemplateFieldtypes
            will not have a parent_data_field_key and will be entered only once in the Post request DocumentTemplatePayload.
    DocumentTemplatePayload:
      type: object
      properties:
        document_template_id:
          required: true
          type: integer
          format: int32
          description: This is the documentTemplateId you will create a contract using
        filename:
          required: true
          type: string
          description: The filename the resulting Document object should have
        project_id:
          required: true
          type: integer
          format: int32
          description: The projectId the document template can be found in
        matter_version_name:
          type: string
          required: true
          description: The name the resulting MatterVersion should have which the new document will be saved to
        matter_name:
          required: true
          type: string
          description: The name the resulting Matter should have which the document will be saved to
        folder_id:
          required: false
          type: integer
          format: int32
          description: The folderId of the folder in Luminance the new document should be saved to
        fields:
          type: object
          description: The names of the fields in this object will vary depending on the fields for the specific documentTemplateFields
            in the /documentTemplateFields endpoint for the documenTemplateId in the payload. Every 'value' type field in
            DocumentTemplateFields objects should be specified in the payload. The field name is found in the DocumentTemplateFields.options.singleInputFieldKey.
            Any 'loop' type DocumentTemplateFields must also be specified, but will not be a key-value pairing. These will
            be key-object pairings, and any 'value' type DocumentTemplateFields with the DocumentTemplateFields.conditions.parent_data_field_key
            value set to the 'loop' type DocumentTemplateFields object's DocumentTemplateFields.options.singleInputFieldKey
            will comprise the keys in the key-value pairing for the 'loop' type key-object. Multiple can be sent in an array.
            See example.
      example:
        non-loopedfield: This is the text in this field
        filename: New Contract
        project_id: 1
        matter_version_name: V1
        matter_name: New Matter
        folder_id: 6
        fields:
          value_field_1: foo
          value_field_2: This is an NDA
          loopfield:
          - value_field_parented_to_loop_1: text
            value_field_parented_to_loop_2: text
          - value_field_parented_to_loop_1: text
            value_field_parented_to_loop_2: text
  responses:
    '201':
      description: Request was successfully fulfilled and resulted in one or possibly multiple new resources being created
    '202':
      description: Request accepted for processing, but the processing has not been finished yet (initiation of traffic light
        analysis)
    '204':
      description: Request completed, but no response payload body will be present (attributed to a successful deletion request)
    '400':
      description: Bad Request - the request was malformed
    '401':
      description: Unauthorized - the authentication provided was invalid
    '403':
      description: Forbidden - the authenticated user does not have sufficient permissions to perform this action
    '404':
      description: Not Found
    '405':
      description: Method not allowed (calling api with wrong method)
    '422':
      description: Unprocessable Entity - the request was well formed, but not processable
    '429':
      description: Too many requests have been sent to the server over a given time period. Please contact Luminance's support
        team.
    '500':
      description: Internal server error
    annotation_types_200:
      description: JSON array of annotationType objects available in the instance, or a single JSON annotationSource object
        if annotationTypeId is referenced in the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnotationType'
          example:
            id: 1
            created_at: '2021-10-25T11:58:31.879Z'
            created_by: 1
            type: entity:datetime
            key: contract:effective
            pre-built: true
            name: Effective Date
            options: {}
    annotation_sources_200:
      description: JSON array of annotationSource objects available in the instance, or a single JSON annotationSource object
        if annotationSourceId is referenced in the path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnotationSource'
          example:
            id: 56
            created_at: '2021-10-25T11:58:31.879Z'
            created_by: 1
            annotation_type_id: 345
            project_id: 2
            workflow_id: 3
            annotation_source_relation_id: null
            content:
              type: object
              example:
                party: VoicePhone Limited
                raw_text: Voicephone Ltd.
            state: active
