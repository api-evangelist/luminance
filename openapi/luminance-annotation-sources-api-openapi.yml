openapi: 3.2.0
info:
  title: Luminance Public API v2 Annotation Sources API
  version: '1.5'
  description: Luminance offers a RESTful HTTP-based API utilizing JSON as the primary serialization format and OAuth2 for authentication.
servers:
- url: https://{moniker}.app.luminance.com
  description: Your Luminance instance
  variables:
    moniker:
      default: your-instance
      description: Instance moniker (e.g. acme)
security:
- bearerAuth: []
tags:
- name: Annotation Sources
paths:
  /api2/annotation_sources:
    get:
      tags:
      - Annotation Sources
      summary: List annotation sources
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: annotation_type_id
        schema:
          type: integer
      - in: query
        name: room_id
        schema:
          type: integer
      - in: query
        name: workflow_id
        schema:
          type: integer
      - in: query
        name: annotation_source_relation_id
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: Sample text
                state: active
      operationId: getApi2AnnotationSources
      x-operation-id-source: derived
    post:
      tags:
      - Annotation Sources
      summary: Create annotation source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                annotation_type_id:
                  type: integer
                room_id:
                  type: integer
                workflow_id:
                  type: integer
                annotation_source_relation_id:
                  type: integer
                content:
                  type: object
            example:
              annotation_type_id: 97
              room_id: 1
              workflow_id: null
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: {}
                state: active
      operationId: postApi2AnnotationSources
      x-operation-id-source: derived
    patch:
      tags:
      - Annotation Sources
      summary: Update annotation sources by filter
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: annotation_type_id
        schema:
          type: integer
      - in: query
        name: room_id
        schema:
          type: integer
      - in: query
        name: workflow_id
        schema:
          type: integer
      - in: query
        name: annotation_source_relation_id
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                annotation_type_id:
                  type: integer
                room_id:
                  type: integer
                workflow_id:
                  type: integer
                annotation_source_relation_id:
                  type: integer
                content:
                  type: object
                state:
                  type: string
            example:
              state: active
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: Sample text
                state: active
      operationId: patchApi2AnnotationSources
      x-operation-id-source: derived
  /api2/annotation_sources/{id}:
    get:
      tags:
      - Annotation Sources
      summary: Get annotation source
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: Sample text
                state: active
        '404':
          description: Not found
      operationId: getApi2AnnotationSourcesById
      x-operation-id-source: derived
    patch:
      tags:
      - Annotation Sources
      summary: Update annotation source
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                annotation_type_id:
                  type: integer
                room_id:
                  type: integer
                workflow_id:
                  type: integer
                annotation_source_relation_id:
                  type: integer
                content:
                  type: object
                state:
                  type: string
            example:
              state: active
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                annotation_type_id: 1
                room_id: 1
                workflow_id: 1
                annotation_source_relation_id: 1
                content: Sample text
                state: active
      operationId: patchApi2AnnotationSourcesById
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from the OAuth2 client credentials flow. See the Authentication section above for how to obtain a token (curl to your instance token endpoint); then paste the access_token here.

        '
