openapi: 3.2.0
info:
  title: Luminance Public API v2 Annotation Types API
  version: '1.5'
  description: Luminance offers a RESTful HTTP-based API utilizing JSON as the primary serialization format and OAuth2 for authentication.
servers:
- url: https://{moniker}.app.luminance.com
  description: Your Luminance instance
  variables:
    moniker:
      default: your-instance
      description: Instance moniker (e.g. acme)
security:
- bearerAuth: []
tags:
- name: Annotation Types
paths:
  /api2/annotation_types:
    get:
      tags:
      - Annotation Types
      summary: List annotation types
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: key
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: pre_built
        schema:
          type: boolean
      - in: query
        name: options
        schema:
          type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                type: document
                key: example_key
                system: false
                name: Joe Bloggs
                options: {}
      operationId: getApi2AnnotationTypes
      x-operation-id-source: derived
  /api2/annotation_types/{id}:
    get:
      tags:
      - Annotation Types
      summary: Get annotation type by id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                created_at: '2024-01-15T12:00:00.000Z'
                created_by: 1
                type: document
                key: example_key
                system: false
                name: Joe Bloggs
                options: {}
        '404':
          description: Not found
      operationId: getApi2AnnotationTypesById
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from the OAuth2 client credentials flow. See the Authentication section above for how to obtain a token (curl to your instance token endpoint); then paste the access_token here.

        '
