pointer_note: >-
  Deliberately NOT wired as `type: MCPServer` in apis.yml. Luminance operates no MCP server —
  this is an API Evangelist candidate tool surface derived from the published OpenAPI, and
  emitting the canonical pointer would credit the provider with an agent surface it does not
  ship.
source: openapi/luminance-public-api-v2-openapi-original.yml
search_evidence:
- no MCP server referenced anywhere on www.luminance.com, api.luminance.com or
  help.luminance.com
- no mcp.luminance.com host (does not resolve)
- no first-party package on npm (searched "luminance" — every hit is an unrelated
  colour-luminance utility), PyPI, or a Luminance GitHub organization (github.com/luminance and
  github.com/LuminanceAI both exist but hold zero public repositories)
- no /.well-known/oauth-protected-resource, which a hosted MCP server would normally publish
server:
  name: luminance
  transport: http
  url: null
  note: >-
    Any MCP server for Luminance must be per-instance
    (https://{moniker}.app.luminance.com), because Luminance has no shared multi-tenant data
    plane. Authentication would be the OAuth2 client-credentials exchange at
    /auth/oauth2/token, which maps cleanly onto MCP's OAuth flow.
