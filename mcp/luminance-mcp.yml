excluded_from_candidate_surface:
- reason: filter-scoped bulk PATCH/DELETE operations act on an entire matched set with no
    dry-run, no returned count and no idempotency key; they are unsafe to expose as agent
    tools without an explicit human-in-the-loop gate.
  operations:
  - PATCH /api2/projects/{project_id}/folders
  - DELETE /api2/projects/{project_id}/folders
  - DELETE /api2/projects/{project_id}/documents
  - PATCH /api2/projects/{project_id}/matters
  - DELETE /api2/projects/{project_id}/matters
  - DELETE /api2/projects/{project_id}/matters/{matter_id}/annotations
  - PATCH /api2/projects/{project_id}/tasks/{task_id}/reviews
  - DELETE /api2/projects/{project_id}/tasks/{task_id}/reviews/documents
notes:
- Operations are addressed by method + path because Luminance publishes no operationId on any
  of the 94 v1.5 operations.
- Tool input schemas would inherit directly from each operation's parameters in
  openapi/luminance-public-api-v2-openapi-original.yml.
- >-
  No tool crosswalk artifact is emitted. A crosswalk binds a REAL MCP (or GraphQL) surface to
  OpenAPI operations, and Luminance publishes neither.
